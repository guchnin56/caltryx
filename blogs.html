<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caltryx Blog — Insights on AI Cost Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5F2ED;
            --cream-dark: #EDE9E2;
            --dark: #1C1C1C;
            --muted: #6B6560;
            --accent: #2D5BE3;
            --border: rgba(28, 28, 28, 0.12);
            --serif: 'Playfair Display', Georgia, serif;
            --sans: 'DM Sans', sans-serif;
        }

        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        nav {
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(245, 242, 237, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            color: var(--dark);
        }

        .nav-logo span { color: var(--accent); }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 48px;
        }

        .header {
            margin-bottom: 80px;
            text-align: center;
        }

        h1 {
            font-family: var(--serif);
            font-size: 64px;
            font-weight: 500;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: var(--muted);
            max-width: 600px;
            margin: 0 auto;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 40px;
        }

        .blog-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1), box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border-color: var(--accent);
        }

        .date {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .blog-title {
            font-family: var(--serif);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .excerpt {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .read-more {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .read-more::after {
            content: '→';
            transition: transform 0.2s;
        }

        .blog-card:hover .read-more::after {
            transform: translateX(4px);
        }

        .loading {
            text-align: center;
            padding: 100px;
            font-size: 18px;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            h1 { font-size: 48px; }
            main { padding: 40px 24px; }
            nav { padding: 18px 24px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="nav-logo">Caltryx<span>.</span></a>
    <a href="/waitlist" style="text-decoration: none; color: var(--dark); font-weight: 600; font-size: 14px; background: #fff; padding: 10px 20px; border-radius: 100px; border: 1px solid var(--border);">Join Waitlist</a>
</nav>

<main>
    <div class="header">
        <h1>Insights<span>.</span></h1>
        <p class="subtitle">Deep dives into AI unit economics, LLM cost management, and the future of agentic infrastructure.</p>
    </div>

    <div id="blog-container" class="blog-grid">
        <div class="loading">Fetching the latest insights...</div>
    </div>
</main>

    <footer style="margin-top: 120px; padding: 64px 48px; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 14px;">
        &copy; 2026 Caltryx. The ultimate AI observability infrastructure built by <a href="https://x.com/showslikesummu" target="_blank" style="color: var(--accent); text-decoration: none;">summu</a>.<br/>
        Hyderabad, India.
    </footer>

    <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;
    const SUPABASE_ANON_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchBlogs() {
        const container = document.getElementById('blog-container');
        try {
            const { data, error } = await supabase
                .from('blogs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">No insights shared yet. Check back soon.</div>';
                return;
            }

            container.innerHTML = data.map(post => `
                <a href="/blog-post.html?s=${post.slug}" class="blog-card">
                    <div class="date">${new Date(post.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</div>
                    <div class="blog-title">${post.title}</div>
                    <div class="excerpt">${post.excerpt || 'Read the full deep dive on LLM costs and AI operations.'}</div>
                    <div class="read-more">Read Article</div>
                </a>
            `).join('');

        } catch (err) {
            console.error('Error fetching blogs:', err);
            container.innerHTML = '<div class="loading">Unable to load insights at this time.</div>';
        }
    }

    fetchBlogs();
</script>

</body>
</html>
